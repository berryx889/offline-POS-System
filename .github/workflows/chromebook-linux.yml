name: Build Chromebook packages

on:
  workflow_dispatch:
  push:
    tags:
      - "chromebook-v*"

permissions:
  contents: read

jobs:
  build-deb:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Build Chromebook Debian package
        run: npm run tauri build -- --bundles deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: countertop-pos-chromebook-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
